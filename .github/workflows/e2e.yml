name: "CI: E2E"

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string

jobs:
  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Deliberately no node_modules or ~/.cache/ms-playwright cache here. Both
      # were tried (#44) and measured slower: the four cache steps cost ~30-40s
      # of restore/save to move ~130 MB, while the Chromium download they replace
      # takes ~5s from Playwright's CDN. The node_modules cache made it worse
      # still — the key is seeded by setup's full-workspace install, but this job
      # runs `npm install --workspaces=false`, so npm prunes a tree it doesn't
      # want. tammet's e2e job: 44-56s before, 95-98s after.
      - name: Install dependencies
        timeout-minutes: 5
        run: npm run e2e:install

      - name: Run E2E tests
        env:
          URL: ${{ inputs.url }}
        run: npm run e2e:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
