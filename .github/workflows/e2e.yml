name: "CI: E2E"

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
    secrets:
      NPM_FONTAWESOME_AUTH_TOKEN:
        required: false
        description: 'Fontawesome Pro npm token. Only needed when the ROOT install pulls @fortawesome packages; most repos keep them in a theme workspace, which `--workspaces=false` skips.'

jobs:
  e2e:
    name: Run E2E tests
    # Not ubuntu-latest: that is now ubuntu-26.04, and Playwright only supports
    # it from 1.61. Sites resolve Playwright from their own package-lock.json and
    # many still lock older releases (holmasto and herrfors lock 1.59.1), so on
    # 26.04 `playwright install` fails with "Playwright does not support chromium
    # on ubuntu26.04-x64". Go back to ubuntu-latest once sites lock >= 1.61.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job does not use the setup action, so it detects the package
      # manager itself — the same rule, from the lockfile on disk.
      - name: Detect the package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "NODE_PACKAGE_MANAGER=pnpm" >> "$GITHUB_ENV"
          else
            echo "NODE_PACKAGE_MANAGER=npm" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        if: env.NODE_PACKAGE_MANAGER == 'pnpm'
        run: corepack enable

      # setup-node's own `cache:` is not used: it takes one package manager as a
      # literal, and this workflow serves both. This is the same ~/.npm it would
      # have cached for npm, plus pnpm's content-addressable store, keyed off
      # whichever lockfile is present — a swap, not an addition to what #44
      # measured.
      - name: Cache the package manager's store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ env.NODE_PACKAGE_MANAGER == 'pnpm' && '~/.local/share/pnpm/store' || '~/.npm' }}
          key: ${{ runner.os }}-${{ env.NODE_PACKAGE_MANAGER }}-store-${{ hashFiles('pnpm-lock.yaml', '**/package-lock.json') }}

      # Deliberately no node_modules or ~/.cache/ms-playwright cache here. Both
      # were tried (#44) and measured slower: the four cache steps cost ~30-40s
      # of restore/save to move ~130 MB, while the Chromium download they replace
      # takes ~5s from Playwright's CDN. The node_modules cache made it worse
      # still — the key is seeded by setup's full-workspace install, while this
      # job installs the root only, so the restored tree gets pruned. tammet's
      # e2e job: 44-56s before, 95-98s after.
      #
      # `e2e:install` installs the root package only — `--workspaces=false` under
      # npm, `--ignore-workspace --no-lockfile` under pnpm — which normally skips
      # the theme where @fortawesome lives. Some repos (kokkikartano.fi, mutti)
      # have those packages in the ROOT tree instead, so the install reaches
      # npm.fontawesome.com and 401s without a token.
      #
      # Guarded in the shell, not with `if:` — secrets.* is not available in step
      # if: expressions inside a reusable workflow. Same pattern as the Yoast
      # token in vulnerability-scan.yml.
      - name: Authenticate with the Fontawesome npm registry
        env:
          FONTAWESOME_TOKEN: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
        run: |
          [ -n "$FONTAWESOME_TOKEN" ] || exit 0
          # Written to ~/.npmrc directly rather than through `npm config set`:
          # both managers read that file, and npm is not necessarily the one
          # installing here.
          printf '//npm.fontawesome.com/:_authToken=%s\n' "$FONTAWESOME_TOKEN" >> ~/.npmrc

      # RUN is every `<manager> run` in this job. pnpm checks node_modules
      # against the lockfile before running *any* script, and that check
      # resolves the whole workspace — reaching a private registry this job
      # holds no token for. It has to be off for both steps below, not just the
      # install: fixing only the install moved the same 401 to `e2e:test`.
      #
      # A CLI flag rather than an env var: npm_config_verify_deps_before_run and
      # npm_config_verifyDepsBeforeRun were both measured and neither works.
      - name: Resolve the run command
        run: |
          if [ "$NODE_PACKAGE_MANAGER" = "pnpm" ]; then
            echo "RUN=pnpm --config.verifyDepsBeforeRun=false run" >> "$GITHUB_ENV"
          else
            echo "RUN=npm run" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        timeout-minutes: 5
        run: $RUN e2e:install

      - name: Run E2E tests
        env:
          URL: ${{ inputs.url }}
        run: $RUN e2e:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
