name: "CI: E2E"

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
    secrets:
      NPM_FONTAWESOME_AUTH_TOKEN:
        required: false
        description: 'Fontawesome Pro npm token. Only needed when the ROOT install pulls @fortawesome packages; most repos keep them in a theme workspace, which `--workspaces=false` skips.'

jobs:
  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ steps.pm.outputs.manager == 'pnpm' && 'pnpm-lock.yaml' || '**/package-lock.json' }}

      - name: Enable Corepack
        if: steps.pm.outputs.manager == 'pnpm'
        run: corepack enable

      # Deliberately no node_modules or ~/.cache/ms-playwright cache here. Both
      # were tried (#44) and measured slower: the four cache steps cost ~30-40s
      # of restore/save to move ~130 MB, while the Chromium download they replace
      # takes ~5s from Playwright's CDN. The node_modules cache made it worse
      # still — the key is seeded by setup's full-workspace install, but this job
      # runs `npm install --workspaces=false`, so npm prunes a tree it doesn't
      # want. tammet's e2e job: 44-56s before, 95-98s after.
      # `e2e:install` runs `npm install --workspaces=false`, which normally skips
      # the theme where @fortawesome lives. Some repos (kokkikartano.fi, mutti)
      # have those packages in the ROOT tree instead, so the install reaches
      # npm.fontawesome.com and 401s without a token.
      #
      # Guarded in the shell, not with `if:` — secrets.* is not available in step
      # if: expressions inside a reusable workflow. Same pattern as the Yoast
      # token in vulnerability-scan.yml.
      - name: Authenticate with the Fontawesome npm registry
        env:
          FONTAWESOME_TOKEN: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
        run: |
          [ -n "$FONTAWESOME_TOKEN" ] || exit 0
          npm config set "//npm.fontawesome.com/:_authToken" "$FONTAWESOME_TOKEN"

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run e2e:install
          else
            npm run e2e:install
          fi

      - name: Run E2E tests
        env:
          URL: ${{ inputs.url }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run e2e:test
          else
            npm run e2e:test
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
