name: "CI: E2E"

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string

jobs:
  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # `npm run e2e:install` reinstalls node_modules and re-downloads the
      # Playwright browsers on every run. Cache both: the browsers keyed loosely
      # so a dependency bump falls back to the previous set and `playwright
      # install` only fetches what actually changed.
      - name: Node modules cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Playwright browser cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        timeout-minutes: 5
        run: npm run e2e:install

      - name: Run E2E tests
        env:
          URL: ${{ inputs.url }}
        run: npm run e2e:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
