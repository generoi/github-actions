name: 'Install WordPress'
description: 'Start MySQL, launch WP dev server, and install WordPress (single or multisite)'

inputs:
  multisite:
    required: false
    default: 'false'
  activate_plugins:
    description: 'Space-separated list of plugins to activate after install (e.g. "advanced-custom-fields polylang-pro")'
    required: false
    default: ''
  redis:
    description: 'Start a Redis server and configure WP_REDIS_HOST in .env'
    required: false
    default: 'false'
  env_vars:
    description: 'Newline-separated KEY=VALUE pairs to set in .env (e.g. "WP_DOMAIN=localhost:8080")'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Start Redis
      if: ${{ inputs.redis == 'true' }}
      uses: shogo82148/actions-setup-redis@2f3253b148c73d7a0682eae73e862b777a4fa74e # v1.49.0

    - name: Start MySQL service
      shell: bash
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE db;' -uroot -proot
        mysql -e "CREATE USER 'db'@'localhost' IDENTIFIED BY 'db';" -uroot -proot
        mysql -e "GRANT ALL PRIVILEGES ON db.* TO 'db'@'localhost' WITH GRANT OPTION;" -uroot -proot

    - name: Setup .env
      shell: bash
      run: |
        cp .env.example .env
        sed -i 's/.*WP_HOME=.*/WP_HOME=http:\/\/localhost:8080/g' .env
        sed -i 's/.*DOMAIN_CURRENT_SITE=.*/DOMAIN_CURRENT_SITE=localhost:8080/g' .env
        sed -i 's/.*DB_HOST=.*/DB_HOST=localhost/g' .env
        if [ "${{ inputs.redis }}" = "true" ]; then
          sed -i 's/.*WP_REDIS_HOST=.*/WP_REDIS_HOST=127.0.0.1/g' .env
        fi

    - name: Apply extra env vars
      if: ${{ inputs.env_vars != '' }}
      shell: bash
      env:
        ENV_VARS: ${{ inputs.env_vars }}
      run: |
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          KEY="${line%%=*}"
          VALUE="${line#*=}"
          if grep -q "^#\?.*${KEY}=" .env; then
            sed -i "s|.*${KEY}=.*|${KEY}=${VALUE}|g" .env
          else
            echo "${KEY}=${VALUE}" >> .env
          fi
        done <<< "$ENV_VARS"

    # Must run AFTER .env exists. `wp server` bootstraps WordPress, which needs
    # DB credentials — started any earlier it binds port 8080, prints "started",
    # then dies as soon as it tries to boot. The caller's retry loop cannot catch
    # that: it waits for the server to come UP, and it briefly does. The failure
    # then surfaces several steps later as a bare curl exit 7.
    - name: Launch web server
      shell: bash
      run: |
        # nohup + disown so the server survives this step's shell exiting.
        nohup ./vendor/bin/wp server > /tmp/wp-server.log 2>&1 &
        echo $! > /tmp/wp-server.pid
        disown || true

        # Verify it is actually accepting connections before this step returns,
        # so a dead server fails HERE with its log rather than downstream.
        # Plain connectivity, not -f: before `wp core install` the site legitimately
        # redirects to the installer, and a 3xx must not count as failure.
        for i in $(seq 1 30); do
          if curl -s -o /dev/null http://localhost:8080/ 2>/dev/null; then
            echo "Web server responding after ${i}s"
            exit 0
          fi
          sleep 1
        done

        echo "::error::Web server never came up on :8080"
        echo "--- wp server output ---"
        cat /tmp/wp-server.log || true
        exit 1

    - name: Install WordPress
      if: ${{ inputs.multisite != 'true' }}
      shell: bash
      run: |
        ./vendor/bin/wp core install \
          --url=http://localhost:8080 \
          --title="Bedrock" \
          --admin_user="admin" \
          --admin_email="bedrock@example.test" \
          --skip-email

    - name: Install WordPress (multisite)
      if: ${{ inputs.multisite == 'true' }}
      shell: bash
      run: |
        ./vendor/bin/wp core multisite-install \
          --url=http://localhost:8080 \
          --title="Bedrock" \
          --admin_email="bedrock@example.test" \
          --skip-config \
          --skip-email

    - name: Activate plugins
      if: ${{ inputs.activate_plugins != '' }}
      shell: bash
      env:
        PLUGINS: ${{ inputs.activate_plugins }}
      run: ./vendor/bin/wp plugin activate $PLUGINS
