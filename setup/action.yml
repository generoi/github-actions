name: 'Setup PHP + Node'
description: 'Setup PHP and Node.js with caching, Fontawesome and Packagist auth'

inputs:
  npm_fontawesome_auth_token:
    required: true
  packagist_github_token:
    description: >
      Composer credential for our private plugin repositories. A PAT on the
      generoi-deploy machine user. Superseded by composer_bot_private_key and
      kept only so repositories can migrate one at a time; pass one or the
      other.
    required: false
    default: ''
  composer_bot_private_key:
    description: >
      Private key for the genero-composer-bot GitHub App. When set, an
      installation token is minted per run and used instead of
      packagist_github_token. Preferred: it expires in an hour, never needs
      rotating, and is scoped by what the app is installed on rather than by
      what a machine user has accumulated access to.
    required: false
    default: ''
  composer_bot_client_id:
    description: >
      genero-composer-bot's client id. Not a secret — GET /orgs/{org}/installations
      returns it to any org member. Override only if the app is ever replaced.
    required: false
    default: 'Iv23liSq2pR9zC6lUtCH'
  yoast_license_token:
    description: 'Optional Yoast Premium license token for my.yoast.com Composer repository'
    required: false
    default: ''
  composer_dev:
    description: >
      Whether the caller installs dev dependencies into the workspace vendor/
      ('true', the default) or passes --no-dev ('false'). It selects the vendor
      cache key, because a vendor built without dev packages is not
      interchangeable with one built with them — and the download-cache gate
      below assumes a vendor hit means composer install has nothing to do.
      Note that deployer's own --no-dev install happens in build_path, not the
      workspace, so it does not affect this.
    required: false
    default: 'true'
  composer_download_cache:
    description: >
      'always' (default) restores the Composer download cache unconditionally.
      'on-vendor-miss' skips it when the vendor cache already hit, where
      composer install is a no-op — worth ~11s a run. Deployments must keep
      'always': deployer builds in a fresh build_path with no vendor, so it
      needs the package zips even when the workspace vendor cache hit.
    required: false
    default: 'always'

runs:
  using: 'composite'
  steps:
    # Hash the lock files ONCE, before any cache is restored.
    #
    # These keys used to embed hashFiles() directly, and that glob walks whatever
    # is in the workspace at the time — including a restored vendor/. Some
    # composer packages ship a package-lock.json, so the node_modules key came
    # out differently depending on whether the vendor cache had hit:
    #
    #   vendor miss -> Linux-node-modules-589366ea...
    #   vendor hit  -> Linux-node-modules-c843c104...
    #
    # Same commit, two keys, so that repo's node_modules cache could never hit
    # and its 188 MiB entries were dead weight. Computing the hashes here, off
    # the bare checkout, makes every key independent of restore order.
    - name: Compute cache keys
      shell: bash
      run: |
        echo "COMPOSER_LOCK_HASH=${{ hashFiles('**/composer.lock') }}" >> "$GITHUB_ENV"
        if [ -f pnpm-lock.yaml ]; then
          echo "NODE_PACKAGE_MANAGER=pnpm" >> "$GITHUB_ENV"
          echo "NODE_LOCK_HASH=${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_ENV"
          echo "NODE_MODULES_CACHE_KEY=${{ runner.os }}-pnpm-node-modules-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_ENV"
        else
          echo "NODE_PACKAGE_MANAGER=npm" >> "$GITHUB_ENV"
          echo "NODE_LOCK_HASH=${{ hashFiles('**/package-lock.json') }}" >> "$GITHUB_ENV"
          # Keep the pre-pnpm key shape so existing npm repo caches stay valid.
          echo "NODE_MODULES_CACHE_KEY=${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}" >> "$GITHUB_ENV"
        fi

    - name: Setup Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      # No `cache:` on purpose: the "Node modules cache" step below caches
      # **/node_modules directly, and when that hits, install is a no-op.
      with:
        node-version-file: .nvmrc

    - name: Enable Corepack
      if: env.NODE_PACKAGE_MANAGER == 'pnpm'
      shell: bash
      run: corepack enable

    - name: Authenticate with Fontawesome NPM repository
      shell: bash
      env:
        FONTAWESOME_TOKEN: ${{ inputs.npm_fontawesome_auth_token }}
      run: |
        npm config set "//npm.fontawesome.com/:_authToken" "$FONTAWESOME_TOKEN"

    # npm install is the largest remaining cost in these jobs, and it is almost
    # entirely the audit — a network round trip over the whole tree, on every run,
    # even when node_modules was restored intact:
    #
    #   snellmanrecipes  up to date, audited 1716 packages in 48s
    #   beamex           up to date, audited 1880 packages in 60s
    #   kaskipuu         up to date, audited 1930 packages in 1m
    #
    # Measured locally on a 1250-package tree: 9s with audit, 1s without.
    #
    # Set as npm config rather than CLI flags so it applies to every npm call,
    # including those inside projects' own composer scripts. Dependency
    # vulnerabilities are covered by the nightly scan, which actually gates;
    # npm's install-time audit output gates nothing.
    - name: Configure npm for CI
      if: env.NODE_PACKAGE_MANAGER == 'npm'
      shell: bash
      run: |
        npm config set audit false
        npm config set fund false

    - name: Read PHP version from composer.json to env
      shell: bash
      run: |
        echo "PHP_VERSION=$(cat ./composer.json | jq -r '.config.platform.php')" >> "$GITHUB_ENV"

    - name: Setup PHP
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: ${{ env.PHP_VERSION }}
        # Pin Composer to a release that includes the fix for GHSA-f9f8-rm49-7jv2
        # (GITHUB_TOKEN disclosure in Composer's GitHub Actions log output).
        tools: composer:2.9.8
        # No coverage driver: nothing here measures coverage, and an active
        # xdebug slows every PHP process it loads into, composer included.
        coverage: none

    # All Composer GitHub auth lives in composer-auth, including the reason it
    # takes two entries rather than one. Must come after setup-php: it writes
    # through `composer config`.
    - name: Authenticate Composer with GitHub
      uses: generoi/github-actions/composer-auth@v2
      with:
        packagist_github_token: ${{ inputs.packagist_github_token }}
        composer_bot_private_key: ${{ inputs.composer_bot_private_key }}
        composer_bot_client_id: ${{ inputs.composer_bot_client_id }}

    - name: Authenticate with Yoast Premium Composer repository
      if: inputs.yoast_license_token != ''
      shell: bash
      env:
        YOAST_TOKEN: ${{ inputs.yoast_license_token }}
      run: |
        composer config -g http-basic.my.yoast.com token "$YOAST_TOKEN"

    - name: Get Composer Cache Directory
      id: composer-cache
      shell: bash
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    # Restoring vendor is worth it: rebuilding it from the download cache costs
    # ~18s on a Bedrock project, against ~8s to save and ~2s to restore (measured
    # in #44, which removed this and made test runs slower).
    #
    # Safe despite caching a build artefact: the key is exact — no restore-keys —
    # so a hit means composer.lock is byte-identical, and every caller runs
    # `composer install` straight after, which reconciles vendor against the lock
    # via installed.json and re-dumps the autoloader from the current
    # composer.json. Don't add restore-keys: a prefix hit would restore a vendor
    # built from a different lock, leaving composer to reconcile a delta.
    #
    # Restored before the download cache so that cache can be skipped when this
    # one hits — see composer_download_cache.
    - name: Composer vendor cache
      id: vendor-cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: vendor
        key: ${{ runner.os }}-vendor-php${{ env.PHP_VERSION }}-${{ inputs.composer_dev == 'false' && 'nodev' || 'dev' }}-${{ env.COMPOSER_LOCK_HASH }}

    # ~288 MB and ~11s to restore — the most expensive entry here. Both caches
    # key on the composer.lock hash, so they hit and miss together; this one
    # carries restore-keys, so on a lock change it prefix-restores and hands
    # composer nearly all the zips locally. That is when it earns its size.
    #
    # When the vendor cache hit, composer install is a no-op ("Nothing to
    # install") and those 11s buy nothing, so callers whose install is a no-op
    # in the steady state pass 'on-vendor-miss'. Skipping the step also skips
    # its save, which is correct: nothing was downloaded.
    - name: Composer download cache
      if: inputs.composer_download_cache == 'always' || steps.vendor-cache.outputs.cache-hit != 'true'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-php${{ env.PHP_VERSION }}-${{ env.COMPOSER_LOCK_HASH }}
        restore-keys: |
          ${{ runner.os }}-composer-php${{ env.PHP_VERSION }}-

    - name: Node modules cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: '**/node_modules'
        key: ${{ env.NODE_MODULES_CACHE_KEY }}
